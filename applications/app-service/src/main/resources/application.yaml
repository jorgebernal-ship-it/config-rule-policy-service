server:
  port: 8080
spring:
  application:
    name: "poc_opa_config"

  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    active: local

# === CONFIGURACIONES DE LA POC (GITHUB Y CONFIG SERVER) ===
config:
  server:
    url: "http://localhost:8888" # La URL donde corre tu Spring Cloud Config Server externo

github:
  owner: "jorgebd09"
  repo: "pruebaTUL"

# ==========================================================
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
aws:
  region: "us-east-1"
  dynamodb:
    endpoint: "http://localhost:8010"
adapters:
  aws:
    s3:
      bucketName: "policies-bucket"
      region: "us-east-1"
      endpoint: "http://localhost:4566"
