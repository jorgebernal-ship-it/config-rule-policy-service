server:
  port: 8080
spring:
  application:
    name: "poc_opa_config"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    active: local
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
aws:
  region: "us-east-1"
  dynamodb:
    endpoint: "http://localhost:8010"
adapters:
  aws:
    s3:
      bucketName: "policies-bucket"
      region: "us-east-1"
      endpoint: "https://s3.localhost.localstack.cloud:4566"
